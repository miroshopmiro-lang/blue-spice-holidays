<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="url(#bg-gradient)"/>
  <defs>
    <radialGradient id="bg-gradient" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#0B2D6B"/>
      <stop offset="100%" stop-color="#030E29"/>
    </radialGradient>
  </defs>
  <!-- Subtle pattern overlay -->
  <circle cx="400" cy="270" r="140" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="4 8" opacity="0.3"/>
  <circle cx="400" cy="270" r="180" fill="none" stroke="#2A7DE1" stroke-width="1" stroke-dasharray="6 12" opacity="0.2"/>
  
  <!-- Compass / Globe Icon -->
  <g transform="translate(400, 250)" opacity="0.85">
    <circle cx="0" cy="0" r="45" stroke="#D4AF37" stroke-width="2" fill="#0B2D6B" fill-opacity="0.6"/>
    <path d="M0 -35 L8 0 L0 35 L-8 0 Z" fill="#D4AF37"/>
    <path d="M-35 0 L0 -8 L35 0 L0 8 Z" fill="#2A7DE1"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
  </g>
  
  <text x="400" y="345" text-anchor="middle" fill="#D4AF37" font-family="Cinzel, Georgia, serif" font-size="16" font-weight="bold" letter-spacing="4" opacity="0.9">BLUE SPICE HOLIDAYS</text>
  <text x="400" y="375" text-anchor="middle" fill="#FFFFFF" font-family="Montserrat, sans-serif" font-size="13" letter-spacing="2" opacity="0.65">PHOTO COMING SOON</text>
</svg>
